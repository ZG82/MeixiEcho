<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 250" width="500" height="250">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE55C"/>
      <stop offset="30%" style="stop-color:#FFC107"/>
      <stop offset="60%" style="stop-color:#FF8F00"/>
      <stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BCD4"/>
      <stop offset="50%" style="stop-color:#2196F3"/>
      <stop offset="100%" style="stop-color:#1565C0"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#66BB6A"/>
      <stop offset="100%" style="stop-color:#1B5E20"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A"/>
      <stop offset="50%" style="stop-color:#1B263B"/>
      <stop offset="100%" style="stop-color:#0D1B2A"/>
    </linearGradient>
    <filter id="glowGold">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circleClip">
      <circle cx="250" cy="125" r="110"/>
    </clipPath>
  </defs>
  
  <rect width="500" height="250" fill="url(#bgGrad)" rx="15"/>
  
  <g clip-path="url(#circleClip)">
    <path d="M0,200 Q50,180 100,190 T200,170 T300,190 T400,170 T500,180" stroke="url(#waterGrad)" stroke-width="4" fill="none" opacity="0.5"/>
    <path d="M0,220 Q60,200 120,210 T240,190 T360,210 T480,190" stroke="url(#waterGrad)" stroke-width="2" fill="none" opacity="0.3"/>
    <path d="M0,240 Q70,220 140,230 T280,210 T420,230 T500,210" stroke="url(#waterGrad)" stroke-width="1" fill="none" opacity="0.2"/>
  </g>
  
  <g transform="translate(80, 125)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.2"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.15"/>
    <path d="M0,0 Q40,-25 35,-55 Q28,-38 0,-42 Q-28,-38 -35,-55 Q-40,-25 0,0" fill="url(#goldGrad)" opacity="0.95"/>
    <circle cx="0" cy="-12" r="10" fill="#FFFDE7"/>
    <line x1="0" y1="5" x2="0" y2="55" stroke="url(#goldGrad)" stroke-width="4"/>
    <path d="M0,55 Q20,48 40,25 Q35,42 0,52" stroke="url(#goldGrad)" stroke-width="4" fill="none"/>
    <path d="M0,55 Q20,62 40,85" stroke="url(#goldGrad)" stroke-width="4" fill="none"/>
    <circle cx="25" cy="35" r="3" fill="#FFE55C"/>
  </g>
  
  <g transform="translate(420, 125)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#leafGrad)" stroke-width="1.5" opacity="0.2"/>
    <path d="M0,0 Q30,-20 28,-45 Q22,-32 0,-38 Q-22,-32 -28,-45 Q-30,-20 0,0" fill="url(#leafGrad)" opacity="0.85"/>
    <circle cx="0" cy="-10" r="7" fill="#C8E6C9"/>
    <line x1="0" y1="3" x2="0" y2="45" stroke="url(#leafGrad)" stroke-width="3"/>
    <path d="M0,45 Q15,40 25,22 Q22,35 0,42" stroke="url(#leafGrad)" stroke-width="3" fill="none"/>
  </g>
  
  <g filter="url(#glowGold)">
    <text x="145" y="120" font-family="Microsoft YaHei, SimHei, serif" font-size="60" font-weight="bold" fill="url(#goldGrad)">
      梅溪回响
    </text>
  </g>
  
  <text x="145" y="155" font-family="Microsoft YaHei, SimHei, serif" font-size="22" fill="#81D4FA" opacity="0.9">
    MEIXI ECHO
  </text>
  
  <g transform="translate(390, 215)">
    <rect x="-8" y="-18" width="45" height="22" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" rx="4"/>
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" fill="#FFE55C" font-weight="bold" text-anchor="middle">
      zjh
    </text>
  </g>
  
  <g transform="translate(70, 70)">
    <circle cx="0" cy="0" r="8" fill="url(#waterGrad)" opacity="0.8"/>
    <circle cx="0" cy="15" r="6" fill="url(#waterGrad)" opacity="0.6"/>
    <circle cx="0" cy="28" r="4" fill="url(#waterGrad)" opacity="0.4"/>
    <line x1="0" y1="-8" x2="0" y2="35" stroke="url(#waterGrad)" stroke-width="2" opacity="0.5"/>
  </g>
  
  <g transform="translate(430, 70)">
    <circle cx="0" cy="0" r="6" fill="url(#leafGrad)" opacity="0.8"/>
    <circle cx="0" cy="12" r="4" fill="url(#leafGrad)" opacity="0.6"/>
    <line x1="0" y1="-6" x2="0" y2="20" stroke="url(#leafGrad)" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <g transform="translate(100, 180)">
    <path d="M0,0 Q8,-6 15,-3 Q20,-8 28,-5 Q32,-10 40,-7" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.4"/>
    <circle cx="0" cy="0" r="3" fill="url(#goldGrad)" opacity="0.6"/>
    <circle cx="15" cy="-3" r="2" fill="url(#goldGrad)" opacity="0.5"/>
    <circle cx="28" cy="-5" r="2" fill="url(#goldGrad)" opacity="0.4"/>
    <circle cx="40" cy="-7" r="1.5" fill="url(#goldGrad)" opacity="0.3"/>
  </g>
  
  <g transform="translate(400, 180)">
    <path d="M0,0 Q-8,-6 -15,-3 Q-20,-8 -28,-5 Q-32,-10 -40,-7" stroke="url(#leafGrad)" stroke-width="2" fill="none" opacity="0.4"/>
    <circle cx="0" cy="0" r="3" fill="url(#leafGrad)" opacity="0.6"/>
    <circle cx="-15" cy="-3" r="2" fill="url(#leafGrad)" opacity="0.5"/>
    <circle cx="-28" cy="-5" r="2" fill="url(#leafGrad)" opacity="0.4"/>
    <circle cx="-40" cy="-7" r="1.5" fill="url(#leafGrad)" opacity="0.3"/>
  </g>
  
  <g transform="translate(250, 45)">
    <path d="M-40,0 Q-20,-15 0,-20 Q20,-15 40,0" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.3"/>
    <circle cx="-30" cy="0" r="4" fill="url(#goldGrad)" opacity="0.4"/>
    <circle cx="-15" cy="-10" r="3" fill="url(#goldGrad)" opacity="0.5"/>
    <circle cx="0" cy="-18" r="5" fill="url(#goldGrad)" opacity="0.6"/>
    <circle cx="15" cy="-10" r="3" fill="url(#goldGrad)" opacity="0.5"/>
    <circle cx="30" cy="0" r="4" fill="url(#goldGrad)" opacity="0.4"/>
  </g>
</svg>